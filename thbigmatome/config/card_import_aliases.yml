# 取り込み（CardImporter）が既存カードを当てる時の、variant の改名表。
# card_set・player（基の Player の名前）・from（本番の旧行の variant）・to（CSV の variant）で限定する。
# 全体置換にしないこと（西行寺 幽々子の「楼閣」のように、別の持ち主では正規の variant として残る）。
variant_renames:
  # 魂魄 妖夢（PM2026）: 本番は「楼閣」で取り込まれていたが、読み直し（cmd_1888）で版の名前が「幽冥」に直った。
  # 背番号 34・打撃表・守備・走力が同じ。別の版の「エイプリル」（背番号も 34）と区別するため、表で明示する。
  - card_set: PM2026
    player: 魂魄 妖夢
    from: 楼閣
    to: 幽冥
