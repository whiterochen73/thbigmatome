# node_modules 方式を使う（vite / vitest / Dockerfile / 開発サーバーが node_modules 前提のため）
nodeLinker: node-modules

# 公開から 7 日未満の版を解決対象から外す（供給網対策・cmd_1799）。
# 単位に注意: 数値だけ書くと「分」になる。"7d" と書けば日。
# 回避は yarn add --no-time-gate <pkg>、または npmPreapprovedPackages で明示した時だけ。
npmMinimalAgeGate: "7d"

# install 時の lifecycle script（postinstall 等）を実行しない（旧 .npmrc の ignore-scripts=true 相当）
enableScripts: false
