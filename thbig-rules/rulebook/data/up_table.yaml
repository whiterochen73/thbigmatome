# UP表（好プレー珍プレー表）
# 出典: wiki/highlight_table.md（https://thbigbaseball.wiki.fc2.com/wiki/好プレー珍プレー表）
# 取得日: 2026-02-20
#
# 使い方:
#   1. UP が出た打席で、1つ目と2つ目の d20 をロールする
#   2. first_d20 / second_d20 の座標に一致する entry を選ぶ
#   3. outcome と条件分岐を処理する
#
# code_range は表示用の4桁コード範囲である。実際の被覆は dice_coordinates
# （01〜20 × 01〜20）で定義するため、0121 のような非生成コードは含まない。

metadata:
  source: "wiki/highlight_table.md"
  source_url: "https://thbigbaseball.wiki.fc2.com/wiki/好プレー珍プレー表"
  supporting_rulebook: "rulebook/06-up-table.md"
  retrieved_at: "2026-02-20"
  description: "UP時の2d20コードから特殊イベントを決定する表"
  dice: "2d20（順序あり）"
  axis_row: "1つ目のd20（01〜20、コードの前2桁）"
  axis_col: "2つ目のd20（01〜20、コードの後2桁）"
  code_space:
    total_cells: 400
    source_derived_cells: 400
    source_unspecified_cells: 0
    coverage: "400/400 = 100%; 原典に記載なしのコードはない"
  frequency_basis: "UPは打席あたり5%（打撃表の出目20）。plate_appearance_share = code_space_share × 5%"

# code_count は400コード空間内のセル数。条件付き結果では共有はコード到達時の値であり、
# 走者状況・守備値・追加d20の確率分布は織り込まない。
